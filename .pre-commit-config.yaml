# Formatting is not enforced yet: the existing tree is not ruff-formatted, so
# the first format run would create a large unrelated diff. Add ruff-format
# here (and in CI) once the codebase has been formatted in its own commit.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check
        args: [--fix]
