[project]
name = "SIMPLE"
version = "0.23.0"
description = "SIMPLE, a Command Line Interface coded in python with a focus on ease of use, rapidity and flexibility. This tool will (I hope) help researchers upload MIAPPE compliant phenotyping data on OpenSilex instances."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = [
    "lxml>=6.1",
    "numpy>=2.4",
    "openpyxl>=3.1.5",
    "opensilexclienttoolspython",
    "pandas>=3.0",
    "requests>=2.34",
    "rich>=15.0",
]

[project.optional-dependencies]
gui = ["PyQt6>=6.7"]

[project.scripts]
simple = "simple.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# The OpenSilex client is not published on PyPI: pin it to a known revision.
[tool.uv.sources]
opensilexclienttoolspython = { git = "https://github.com/OpenSILEX/opensilexClientToolsPython.git", rev = "e26032c2620ec0a142c0601f43b83566788c4a25" }

[dependency-groups]
dev = [
    "coverage[toml]>=7.0",
    "pytest>=9.1",
]
build = [
    "pyinstaller>=6.21",
]

[tool.coverage.run]
source = ["simple"]
branch = true
omit = [
    "*/tests/*",
    "*/__main__.py",
    "*/console.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 35
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "pass",
]

[tool.coverage.html]
directory = "htmlcov"
