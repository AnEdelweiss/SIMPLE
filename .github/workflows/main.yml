name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (e.g. v0.23.0)"
        required: true

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
      - name: Install project + dev dependencies
        run: uv sync
      - name: Run tests with coverage
        run: uv run coverage run -m pytest -q
      - name: Enforce coverage threshold
        run: uv run coverage report --fail-under=65

  build:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: "3.14"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Install dependencies (CLI + GUI + build tooling)
        run: uv sync --extra gui --group build --no-dev

      - name: Build CLI executable
        run: uv run pyinstaller --onefile --name SIMPLE --icon=docs/favicon.ico src/simple/__main__.py

      - name: Create GUI entry script
        run: |
          cat << 'EOF' > launch_gui.py
          import runpy
          import sys

          # Kept as a real import (not a string) so PyInstaller's static
          # analysis bundles the `simple` package into the executable.
          import simple.__main__  # noqa: F401

          if '--gui' not in sys.argv:
              sys.argv.append('--gui')

          runpy.run_module('simple.__main__', run_name='__main__')
          EOF
        shell: bash

      - name: Build GUI executable
        run: uv run pyinstaller --onefile --windowed --name SIMPLE-gui --icon=docs/favicon.ico launch_gui.py

      - name: Rename executables (Linux)
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            mv dist/SIMPLE dist/SIMPLE-linux
            mv dist/SIMPLE-gui dist/SIMPLE-gui-linux
          fi
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.os }}
          path: dist/*

  release:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Make Linux executables runnable
        run: chmod +x SIMPLE-linux SIMPLE-gui-linux || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: Release ${{ github.event.inputs.version }}
          draft: false
          prerelease: true
          files: |
            SIMPLE-linux
            SIMPLE.exe
            SIMPLE-gui-linux
            SIMPLE-gui.exe
